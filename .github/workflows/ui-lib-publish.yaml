name: Build UI Component Library & Publish

on:
  push:
    branches: [master]

env:
  NODE_VERSION: "24"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Code
        uses: actions/checkout@v7

      - name: Build Library
        uses: ././github/actions/build-library
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check Built
        run: npm pack --dry-run

      - name: Publish to NPM
        run: npm publish --access public
