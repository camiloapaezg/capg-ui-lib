name: Test & Build

on:
  pull_request:
    branches: [master]

jobs:
  test-and-build:
    name: Run Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - run: npm test
      - run: npm run build
